<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Propuesta Jeeves × SURA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0B0B0E;--c1:#141418;--c2:#17171C;--g:#00D68F;--au:#C9A84C;--t:#F5F5F7;--m:#9C9CA6;--b:#26262E;--sura:#0033A0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;letter-spacing:-.01em}
a{color:var(--au)}
.gold{color:var(--au)}
#app{max-width:1120px;margin:0 auto;padding:0 20px 40px}
section{padding:56px 0 8px;border-top:1px solid var(--b)}
.pill{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:5px 14px;font-size:12px;color:var(--m);letter-spacing:.03em}
.gold-pill{border-color:rgba(201,168,76,.5);color:var(--au)}
/* gate */
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1b1a14 0,#0B0B0E 60%)}
.gate-box{max-width:440px;width:100%;background:var(--c1);border:1px solid var(--b);border-radius:20px;padding:36px 28px;text-align:center}
.gate-box h1{font-size:26px;margin:22px 0 8px}
.gate-box p{color:var(--m);font-size:14px;margin:0 0 22px}
#gf{display:flex;gap:8px}
#gf input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:12px 14px;color:var(--t);font-size:15px}
#gf button{background:var(--au);color:#111;border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}
#err{min-height:20px;margin-top:12px;font-size:13px;color:#ff8a8a}
/* hero */
.topbar{display:flex;align-items:center;gap:14px;padding:22px 0}
.topbar.center{justify-content:center;padding:0}
.logo-j{height:34px;width:auto}
.logo-s{height:30px;width:auto}
.topbar:not(.center){justify-content:space-between}
.topbar:not(.center) .x{display:none}
.x{color:var(--m);font-size:20px}
.hero{padding-bottom:30px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-top:24px}
.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.12;margin:16px 0 14px}
.lead{color:var(--m);font-size:16px;margin:0 0 22px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{background:var(--c1);border:1px solid var(--b);border-radius:14px;padding:12px}
.chip b{display:block;font-size:17px;color:var(--t)}
.chip span{font-size:12px;color:var(--m)}
.hero-photos{display:grid;grid-template-columns:.8fr 1.2fr;grid-template-rows:auto auto;gap:12px}
.ph{margin:0;background:#000;border:1px solid var(--b);border-radius:16px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:10px;bottom:8px;font-size:11px;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:999px;color:var(--t)}
.ph-card{grid-row:1/3;height:340px}
.ph-vcard{height:164px}
.ph-plat{height:164px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.toc a{font-size:13px;color:var(--m);text-decoration:none;border:1px solid var(--b);border-radius:999px;padding:6px 12px}
.toc a:hover{color:var(--au);border-color:var(--au)}
/* sections */
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.num{width:34px;height:34px;flex:none;border:1px solid var(--au);color:var(--au);border-radius:50%;display:grid;place-items:center;font-weight:700}
.sec-h h2{font-size:clamp(22px,3vw,28px)}
.sub{color:var(--m);margin:0 0 22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.card{background:var(--c1);border:1px solid var(--b);border-radius:16px;padding:18px}
.card .ic{font-size:22px}
.card h3{font-size:16px;margin:8px 0 6px}
.card p{color:var(--m);font-size:14px;margin:0}
.sol{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:start;margin-top:16px}
.sol-list .row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--b);font-size:15px;color:#d6d6dc}
.sol-list b{color:var(--t)}
.tag{flex:none;width:112px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--au);padding-top:3px}
.sol-photo{margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--b);background:#000}
.sol-photo img{width:100%;display:block}
.quote{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.q-main{background:linear-gradient(160deg,#1c1a12,#141418 60%);border:1px solid rgba(201,168,76,.4);border-radius:20px;padding:28px}
.big{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:clamp(34px,5vw,52px);font-weight:800;color:var(--au);margin:14px 0 4px;line-height:1.05}
.big small{font-size:18px;color:var(--m);font-weight:500;margin-left:6px}
.cop{font-size:16px;margin-bottom:12px}
.hint{color:var(--m);font-size:13px}
.unit{margin-top:14px;padding-top:14px;border-top:1px solid var(--b);font-size:14px}
.q-inc{background:var(--c1);border:1px solid var(--b);border-radius:20px;padding:24px}
.q-inc h3{font-size:16px;margin-bottom:10px}
.check{list-style:none;margin:0;padding:0}
.check li{padding:6px 0 6px 26px;position:relative;font-size:14px;color:#d6d6dc}
.check li:before{content:"✓";position:absolute;left:0;color:var(--g);font-weight:700}
.contracts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.contract{background:var(--c1);border:1px solid var(--b);border-left:4px solid var(--au);border-radius:14px;padding:16px}
.contract span{display:block;font-size:13px;color:var(--m)}
.contract b{display:block;font-size:24px;font-family:"Inter Tight",Inter,system-ui,sans-serif;margin:4px 0}
.contract small{color:var(--m);font-size:12px}
.ct-b-e{border-left-color:#5AA9FF}.ct-b-a{border-left-color:var(--g)}.ct-b-d{border-left-color:var(--au)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--b);border-radius:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.tbl th{background:var(--c2);color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:12px 14px}
.tbl td{padding:12px 14px;border-top:1px solid var(--b);vertical-align:middle}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tfoot td{background:#1c1a12;color:var(--au);font-weight:700}
.bar{height:4px;background:var(--b);border-radius:4px;margin-top:6px;max-width:260px}
.bar i{display:block;height:100%;background:var(--au);border-radius:4px}
.ct{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid}
.ct-e{color:#5AA9FF;border-color:#5AA9FF55}.ct-a{color:var(--g);border-color:#00D68F55}.ct-d{color:var(--au);border-color:#C9A84C55}
.foot{color:var(--m);font-size:12.5px;margin-top:12px}
.cupo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.cupo-main{background:var(--c1);border:1px solid var(--b);border-radius:20px;padding:26px}
.cupo-main p{color:#d6d6dc;font-size:14.5px}
.cupo-uses{display:grid;gap:12px}
.use{background:var(--c1);border:1px solid var(--b);border-radius:16px;padding:16px 18px}
.use b{display:block;font-size:20px;font-family:"Inter Tight",Inter,system-ui,sans-serif;color:var(--t)}
.use span{color:var(--m);font-size:13.5px}
.toggle{background:transparent;border:1px solid var(--b);color:var(--t);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14px;margin-bottom:16px}
.toggle:hover{border-color:var(--au)}
#calc{background:var(--c1);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:20px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--m)}
.form input{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:10px 12px;color:var(--t);font-size:14px;font-family:inherit}
.form input:disabled{color:var(--au)}
.form small{font-size:11.5px}
.mod{margin-top:18px;padding-top:16px;border-top:1px solid var(--b)}
.mod-h{margin-bottom:12px}
.sw{font-weight:600;cursor:pointer}
.mini{font-size:14px;color:var(--m);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 12px}
.sav{background:var(--c1);border:1px solid var(--b);border-radius:16px;padding:18px}
.sav span{display:block;color:var(--m);font-size:13px}
.sav b{font-size:24px;font-family:"Inter Tight",Inter,system-ui,sans-serif;color:var(--g)}
.tot{background:var(--c2);border:1px solid var(--b);border-radius:18px;padding:22px}
.tot span{display:block;color:var(--m);font-size:13px}
.tot b{display:block;font-size:30px;font-family:"Inter Tight",Inter,system-ui,sans-serif;color:var(--g);margin:4px 0}
.tot small{color:#d6d6dc;font-size:13px}
.roe{background:linear-gradient(160deg,#2a2412,#17150e);border:1px solid rgba(201,168,76,.55);border-radius:18px;padding:22px;text-align:center}
.roe span{display:block;color:var(--au);font-size:14px;font-weight:600}
.roe b{display:block;font-size:46px;font-family:"Inter Tight",Inter,system-ui,sans-serif;color:var(--au);font-weight:800}
.steps{display:grid;gap:14px;margin-top:16px}
.step{display:flex;gap:16px;background:var(--c1);border:1px solid var(--b);border-radius:16px;padding:18px 20px}
.sn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--au);color:#111;font-weight:800;display:grid;place-items:center}
.step h3{font-size:16px;margin:4px 0 6px}
.step p{color:var(--m);margin:0;font-size:14px}
.docs{margin:10px 0 0;padding-left:20px;color:#d6d6dc;font-size:14px;columns:2;column-gap:28px}
.docs li{margin-bottom:6px;break-inside:avoid}
.sig{margin-top:56px;border-top:1px solid var(--b);padding-top:30px;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.sig .lion{width:100%;border-radius:16px;opacity:.9}
.sig h3{margin-top:12px;font-size:20px}
.sig p{margin:4px 0;color:#d6d6dc}
@media(max-width:860px){
 .hero-grid,.sol,.quote,.cupo,.sig{grid-template-columns:1fr}
 .grid4{grid-template-columns:1fr 1fr}
 .grid3,.contracts,.form{grid-template-columns:1fr}
 .chips{grid-template-columns:1fr 1fr}
 .docs{columns:1}
 .sig .lion{max-width:220px}
}
@media(max-width:520px){
 #app{padding:0 16px 32px}
 .grid4,.grid2{grid-template-columns:1fr}
 .ph-card{height:260px}.ph-vcard,.ph-plat{height:124px}
 .tag{width:84px}
 .logo-j{height:28px}.logo-s{height:24px}
}

.sol{display:block}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pillar{background:var(--c1);border:1px solid var(--b);border-radius:16px;padding:20px;margin:0}
.pillar .tag{display:block;width:auto;padding:0;margin-bottom:6px}
.pillar h3{font-size:17px;margin-bottom:10px}
.pillar ul{margin:0;padding-left:18px;color:#d6d6dc;font-size:14px}
.pillar li{margin-bottom:6px}
.pillar.sol-photo{padding:0;overflow:hidden;background:#000;display:flex;align-items:center}
.pillar.sol-photo img{width:100%;height:100%;object-fit:cover}
.lead{display:none}
@media(max-width:860px){.pillars{grid-template-columns:1fr 1fr}.chips{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.pillars,.chips{grid-template-columns:1fr}}
</style></head>
